<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>OTP 미러링</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>미러링</h1>
      <p class="sub">세컨드폰 화면을 PC로. 미러링 중엔 포워딩이 멈춥니다.</p>
    </header>

    <section class="card status-card">
      <span class="dot" id="dot"></span>
      <div class="status-text">
        <div class="status-title" id="statusTitle">폰 확인 중…</div>
        <div class="status-addr mono" id="statusAddr"></div>
      </div>
      <button class="icon-btn" id="refresh" title="새로고침" aria-label="새로고침">↻</button>
    </section>

    <section class="card">
      <label class="field-label" for="ip">폰 주소</label>
      <div class="input-row">
        <input id="ip" type="text" placeholder="100.65.206.33 (Tailscale IP)" spellcheck="false" />
        <button id="connect" class="btn-secondary">연결</button>
      </div>
      <button id="discover" class="btn-text">같은 WiFi에서 자동 감지</button>
    </section>

    <button id="start" class="btn-primary" disabled>미러링 시작</button>
    <div id="state" class="state idle">대기 중 · 포워딩 활성</div>
    <div id="pushbanner" class="banner" hidden></div>

    <section class="card subtle">
      <div class="mini-row">
        <span class="mini-label">이 PC 주소</span>
        <span id="pcaddr" class="mono mini-value">—</span>
      </div>
      <div class="mini-row">
        <span class="mini-label">초기 설정</span>
        <span class="mini-value">
          <span id="fcmStatus" class="dim">확인 중…</span>
          <button id="pickKey" class="btn-text">파일 불러오기</button>
        </span>
      </div>
      <details class="advanced">
        <summary>USB로 무선 모드 켜기</summary>
        <p class="hint">폰을 USB로 연결한 상태에서 1회 실행하면 무선(5555)으로 전환합니다.</p>
        <button id="wireless" class="btn-secondary full">무선 모드 켜기</button>
      </details>
    </section>

    <footer>
      <span id="version">v—</span>
      <span id="update" class="dim">업데이트 확인 중…</span>
      <button id="installUpdate" class="btn-text" hidden>지금 설치</button>
    </footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
