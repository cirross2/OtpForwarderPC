<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>OTP 미러링</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <div class="logo">🔒</div>
      <h1>OTP 미러링</h1>
      <p class="sub">세컨드폰 화면을 PC로. 미러링 중엔 포워딩 자동 중지.</p>
    </header>

    <section class="card">
      <div class="row">
        <span class="label">연결된 폰</span>
        <span id="device" class="value">확인 중…</span>
      </div>
      <button id="refresh" class="ghost">새로고침</button>
    </section>

    <section class="card">
      <label class="label" for="ip">무선·Tailscale IP <span class="dim">(선택, USB면 비워두세요)</span></label>
      <input id="ip" type="text" placeholder="예: 100.x.x.x 또는 172.30.1.100" />
      <button id="wireless" class="ghost">📡 무선 모드 켜기 (USB 연결 상태에서 1회)</button>
    </section>

    <button id="start" class="primary" disabled>미러링 시작</button>

    <div id="state" class="state idle">● 대기 중 — 포워딩 활성</div>

    <footer>
      <span id="version">v—</span>
      <span id="update" class="dim">업데이트 확인 중…</span>
      <button id="installUpdate" class="link" hidden>지금 설치</button>
    </footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
